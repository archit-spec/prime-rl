[project]
name = "skyrl-swe"
description = "Agentic SWE tasks (SkyRL/SWE-Bench) graded by the swebench harness (deterministic, no judge), run in LOCAL Docker sandboxes."
tags = ["swe", "coding", "multi-turn", "tool-use", "train", "eval"]
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "verifiers>=0.1.13.dev8",
    "mini-swe-agent-plus",
    "swebench==4.1.0",
    "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["skyrl_swe.py", "local_docker_sandbox.py", "pyproject.toml"]

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
