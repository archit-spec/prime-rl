max_steps = 100
seq_len = 102400

# node8 runs trainer (8 GPUs) + orchestrator only.
# Inference runs separately on node9 — see rl_hyperswitch_infer_node9.toml.
# /data is a shared NFS mount, so filesystem weight broadcast works across nodes.
[deployment]
num_train_gpus = 8
num_infer_gpus = 0

[model]
name = "Qwen/Qwen3-30B-A3B"

[wandb]
project = "hyperswitch-rl"
name = "qwen3-30b-hyperswitch"

[orchestrator]
batch_size = 16
rollouts_per_example = 8

# Point orchestrator at node9's inference server
[orchestrator.client]
base_url = ["http://10.29.129.53:8000"]

[orchestrator.train.sampling]
max_completion_tokens = 4096
temperature = 0.7

[[orchestrator.train.env]]
id = "my-custom-env"

[orchestrator.train.env.args]
num_train_examples = 256
num_eval_examples = 32
curriculum_level = 0
max_turns = 80

# Qwen3-30B-A3B has custom impl — enables FP8, EP, proper CP.
# dp_shard auto-resolves to world_size/cp = 8/1 = 8, sharding model+optimizer
# across all 8 GPUs. Per-GPU model states: ~52.5 GB, leaving ~87 GB for
# logits (62 GB at batch=16/dp=8=2 seqs × 102400 × 152064) = 115 GB total.
[trainer.model]
impl = "custom"
attn = "flash_attention_2"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
fp8 = true
cp = 1

[trainer.model.ac]
mode = "full"

[trainer.optim]
lr = 1e-6
