max_steps = 200
# GLM-4.7-Flash has a 154880-token vocab. The vanilla LM head materializes a
# full [seq, vocab] fp32 logits tensor at loss time (seq_len * 154880 * 4 B),
# which OOMs the trainer backward. We enable the fused/chunked LM head below
# (fused_lm_head_token_chunk_size), so peak logits memory is chunk_size * vocab
# regardless of seq_len — that lets us keep a long context here.
seq_len = 102400

[deployment]
num_train_gpus = 4
num_infer_gpus = 4

[model]
name = "zai-org/GLM-4.7-Flash"

[wandb]
project = "hyperswitch-rl"
name = "glm47-flash-compile-gated-structural"

[orchestrator]
# rollouts_per_example = 8 (group size for GRPO advantage normalization).
# batch_size = 16 = 2 unique examples × 8 rollouts each.
# LoRA frees ~74 GB/GPU, giving room to double the batch.
# 2 examples/step improves advantage variance vs 1 example/step.
batch_size = 32
rollouts_per_example = 8
max_inflight_rollouts = 64

[orchestrator.train.sampling]
max_completion_tokens = 4096
# Higher temperature -> more diverse outcomes within each 8-rollout group ->
# more within-group reward variance -> bigger GRPO advantages -> bigger grad.
temperature = 1.0

[[orchestrator.train.env]]
id = "my-custom-env"

[orchestrator.train.env.args]
# 8 was too small: each step samples 4 of them, so per-step reward swung on
# WHICH tasks got picked (masking any learning trend) and risked overfitting.
# 32 gives task diversity and a cleaner progress signal.
num_train_examples = 32
num_eval_examples = 32
curriculum_level = 0
# Env works end-to-end (vf-eval reward 0.127). Give the agent more turns now
# to explore + iterate (cargo check between edits) for higher-quality diffs.
max_turns = 80

# GLM-4.7-Flash is model_type=glm4_moe_lite (native in transformers 5.5,
# NOT in prime-rl's custom glm4_moe mapping), so impl=auto resolves to the
# HF path. Expert-parallel (ep) only engages for custom-impl MoE modules, so
# we omit it and let FSDP shard across the 4 train GPUs.
[trainer.model]
impl = "auto"
# FA3 (Hopper/H200) is ~1.5-2x faster than FA2 at long context; at seq_len
# 102400 attention is a large share of the trainer step. transformers 5.5
# registers flash_attention_3 and routes glm4_moe_lite (the HF auto path)
# through it; flash_attn_3 is installed (is_flash_attn_3_available()=True).
attn = "flash_attention_3"
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
# cp=4 forces dp_shard=1 (world_size/cp = 4/4), so each GPU holds the FULL
# model + optimizer states (~7x weights) and OOMs before any activations.
# Use cp=1 so dp_shard auto-resolves to 4, sharding weights+optimizer states
# across all 4 train GPUs.
cp = 1
# Chunked/fused LM head: computes logprobs in token chunks so the loss phase
# never materializes the full [seq, vocab] logits. Peak logits memory becomes
# chunk_size * vocab (8192 * 154880 * 4 B ~= 5 GB) instead of seq_len * vocab
# (~50 GB at 80k). This is the actual fix for the trainer backward OOM and
# works on the HF/auto path too (inject_prime_lm_head runs for all impls).
fused_lm_head_token_chunk_size = "auto"

# LoRA: only adapter params need optimizer states (~50M vs 26B full params).
# Saves ~74 GB/GPU vs full fine-tuning, freeing headroom for longer context.
[trainer.model.lora]
rank = 32
alpha = 64

# Full activation checkpointing: recompute activations on the backward pass
# instead of storing them. Without CP sequence sharding, each GPU processes
# the full seq_len for every layer, so this is needed to fit activations.
[trainer.model.ac]
mode = "full"

[trainer.optim]
# At 1e-5 per-task reward stayed dead flat over 37 steps despite a HEALTHY
# advantage signal (within-group reward std ~0.14, 0% zero-variance groups) —
# the gradient was fine, the updates were just too small to move a 30B policy.
# With AdamW the per-param step is ~LR and mismatch KL had huge headroom
# (~0.012), so go aggressive: 1e-4 (10x). This is the upper edge for LoRA RL —
# WATCH the first ~10 steps: if mismatch KL runs past ~0.05-0.1, or entropy
# spikes then collapses, or reward craters, halve to 5e-5.
lr = 1e-4

[inference]

[inference.model]
dtype = "bfloat16"

[inference.parallel]
tp = 4

# FP8 KV cache halves KV-cache memory, giving more room for the long context.
[inference.vllm_extra]
kv_cache_dtype = "fp8"

[ckpt]
interval = 10
